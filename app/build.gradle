plugins { id 'com.android.application' }
android {
    namespace 'io.github.mmarkimark.llartv'
    compileSdk 33
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId 'io.github.mmarkimark.llartv'
        minSdk 28          // TV runs Android 9
        targetSdk 33
        versionCode 6
        versionName '1.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'   // real org.json for JVM tests (android.jar only has stubs)
}
