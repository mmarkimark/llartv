name: Feature request
description: Propose a new feature or an improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues (open and closed) first.
        Use a short Conventional Commit style title, for example `feat: show the weather forecast for tomorrow`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or inconvenient today, and when does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should LlarTV do? Mock-ups or screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?
      value: |
        - [ ] 
