name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept the SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install the SDK packages
        run: sdkmanager "platforms;android-33" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR/.. scripts/*.sh
